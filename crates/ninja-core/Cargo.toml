[package]
name = "ninja-core"
description = "Ninja manifest language, build graph and execution engine"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
ninja-os = { path = "../ninja-os" }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
test-dirs = { path = "../test-dirs" }
