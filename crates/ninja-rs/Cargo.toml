[package]
name = "ninja-rs"
description = "A ninja-compatible build executor with native Remote Execution API (REAPI v2) support"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
name = "ninja_rs"
path = "src/lib.rs"

[[bin]]
name = "ninja-rs"
path = "src/main.rs"

[dependencies]
ninja-core = { path = "../ninja-core" }
ninja-daemon = { path = "../ninja-daemon" }
ninja-remote = { path = "../ninja-remote" }
prost = { workspace = true }
prost-types = { workspace = true }
rbe-bes = { path = "../../third_party/cargo-rbe/rbe-bes" }
rbe-client = { path = "../../third_party/cargo-rbe/rbe-client" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
fake-reapi = { path = "../fake-reapi" }

[[test]]
name = "remote_e2e"
harness = false

[[test]]
name = "cli_e2e"
harness = false
