[package]
name = "ninja-rs"
description = "A ninja-compatible build executor with native Remote Execution API (REAPI v2) support"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
name = "ninja_rs"
path = "src/lib.rs"

[[bin]]
name = "ninja-rs"
path = "src/main.rs"

[dependencies]
ninja-core = { path = "../ninja-core" }
ninja-daemon = { path = "../ninja-daemon" }
ninja-os = { path = "../ninja-os" }
ninja-remote = { path = "../ninja-remote" }
prost = { workspace = true }
prost-types = { workspace = true }
rbe-bes = { path = "../../third_party/cargo-rbe/rbe-bes" }
rbe-client = { path = "../../third_party/cargo-rbe/rbe-client" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
fake-reapi = { path = "../fake-reapi" }
test-dirs = { path = "../test-dirs" }

# The peak memory of builds (remote_e2e); the jobs the e2e harness stops.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects", "Win32_System_ProcessStatus"] }

[[test]]
name = "remote_e2e"
harness = false

[[test]]
name = "cli_e2e"
harness = false
