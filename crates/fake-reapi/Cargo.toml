[package]
name = "fake-reapi"
description = "In-process fake REAPI v2 server (CAS, AC, Execution, ByteStream) for tests"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
bazel-remote-apis = { workspace = true }
fastcdc = { workspace = true }
zstd = { workspace = true }
h2 = { workspace = true }
hex = { workspace = true }
prost = { workspace = true }
rbe-bes = { path = "../../third_party/cargo-rbe/rbe-bes" }
# A TLS server closing connections once its handshake is done (misbehaving).
rustls = { workspace = true, features = ["ring", "std"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "io-util"] }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["router", "server"] }

[dev-dependencies]
test-dirs = { path = "../test-dirs" }

[[bin]]
name = "fake-reapi-server"
path = "src/main.rs"
