[workspace]
members = ["crates/*", "third_party/cargo-rbe/rbe-client", "third_party/cargo-rbe/rbe-bes"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
# FastCDC 2020, the reference implementation of REAPI content-defined chunking.
fastcdc = "3.2.1"
bazel-remote-apis = { version = "0.30", default-features = false }
hex = "0.4"
prost = "0.14"
prost-types = "0.14"
protox = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
zstd = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "sync", "signal", "time", "fs", "io-util"] }

# Debug builds hash toolchains (hundreds of MB, the tests' too) in seconds
# rather than minutes.
[profile.dev.package.sha2]
opt-level = 3
