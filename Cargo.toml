[workspace]
members = ["crates/*", "third_party/cargo-rbe/rbe-client", "third_party/cargo-rbe/rbe-bes"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
# FastCDC 2020, the reference implementation of REAPI content-defined chunking.
fastcdc = "3.2.1"
bazel-remote-apis = { version = "0.30", default-features = false }
# Already in the graph through tonic (server): HTTP/2 servers misbehaving
# as a gRPC server never does (tests).
h2 = "0.4"
hex = "0.4"
# Already in the graph through tonic (channel): the TCP connector of its
# channels, for one of rbe-client's own.
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
prost = "0.14"
prost-types = "0.14"
protox = "0.9"
# Already in the graph through tonic (tls-ring): its error types, to tell
# certificates refused apart. No features of its own (not its default
# aws-lc-rs provider).
rustls = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio-stream = "0.1"
# Already in the graph through tonic (tls-ring, tls-webpki-roots): the TLS
# of rbe-client's own connections (it tells a client certificate refused
# from a connection broken), and the public roots they trust by default.
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
# Already in the graph through tokio: only the features each crate names.
windows-sys = "0.61"
zstd = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "sync", "signal", "time", "fs", "io-util"] }

# Debug builds hash toolchains (hundreds of MB, the tests' too) in seconds
# rather than minutes.
[profile.dev.package.sha2]
opt-level = 3
