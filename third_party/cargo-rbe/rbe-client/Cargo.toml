# Copied from https://github.com/Orphis/cargo-rbe (crates/rbe-client) at
# commit a22f3610b45522741860a713139c152449c21042, MIT OR Apache-2.0.
# Local changes are listed in ../README.md.
[package]
name = "rbe-client"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow.workspace = true
bazel-remote-apis.workspace = true
fastcdc.workspace = true
hex.workspace = true
ninja-os = { path = "../../../crates/ninja-os" }
prost.workspace = true
rustls.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
zstd.workspace = true

[dev-dependencies]
test-dirs = { path = "../../../crates/test-dirs" }
# Servers misbehaving in ways the fake one doesn't (tests of lib.rs).
tokio = { workspace = true, features = ["net"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["router", "server"] }
